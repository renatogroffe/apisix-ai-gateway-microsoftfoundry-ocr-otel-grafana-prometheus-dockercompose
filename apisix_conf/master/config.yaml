apisix:
  node_listen: 9080              # APISIX listening port
  enable_ipv6: false
  tracing: true

plugins:
  - real-ip
  - client-control
  - proxy-control
  - request-id
  - zipkin
  - opentelemetry
  - fault-injection
  - mocking
  - serverless-pre-function
  - cors
  - ip-restriction
  - ua-restriction
  - referer-restriction
  - csrf
  - uri-blocker
  - request-validation
  - basic-auth
  - jwt-auth
  - key-auth
  - hmac-auth
  - consumer-restriction
  - forward-auth
  - proxy-cache
  - body-transformer
  - proxy-mirror
  - proxy-rewrite
  - api-breaker
  - limit-conn
  - limit-count
  - limit-req
  - gzip
  - server-info
  - traffic-split
  - redirect
  - response-rewrite
  - prometheus
  - http-logger
  - file-logger
  - tcp-logger
  - syslog
  - udp-logger
  - serverless-post-function
  - ai-proxy
  - ai-prompt-guard
  - ai-proxy-multi
  
nginx_config:
  envs:
    - MICROSOFT_FOUNDRY_API_KEY
  http_server_location_configuration_snippet: |
    set $ai_provider_endpoint "";

plugin_attr:
  opentelemetry:
    resource:
      service.name: APISIX
      deployment.environment.name: development
    collector:
      address: "alloy:4318"
      request_timeout: 3
      request_headers:
        Authorization: ""
    batch_span_processor:
      max_export_batch_size: 32
      inactivity_timeout: 5
  prometheus:                               # Plugin: prometheus attributes
    export_uri: /apisix/prometheus/metrics  # Set the URI for the Prometheus metrics endpoint.
    metric_prefix: apisix_                  # Set the prefix for Prometheus metrics generated by APISIX.
    enable_export_server: true              # Enable the Prometheus export server.
    export_addr:                            # Set the address for the Prometheus export server.
      ip: 0.0.0.0                           # Set the IP.
      port: 9091                            # Set the port.

deployment:
  admin:
    allow_admin:               # https://nginx.org/en/docs/http/ngx_http_access_module.html#allow
      - 0.0.0.0/0              # We need to restrict ip access rules for security. 0.0.0.0/0 is for test.
    enable_admin_ui: true      # UI embutida: http://localhost:9180/ui/

    admin_key:
      - name: "admin"
        key: edd1c9f034335f136f87ad84b625c8f1
        role: admin                 # admin: manage all configuration data

  etcd:
    host:                           # it's possible to define multiple etcd hosts addresses of the same etcd cluster.
      - "http://etcd:2379"          # multiple etcd address
    prefix: "/apisix"               # apisix configurations prefix
    timeout: 30                     # 30 seconds